# Etsy Agents — main settings
# Secrets never go here; they live in .env (see .env.example).

shops:
  - id: main                     # internal key used in output paths and logs
    name: "YOUR_SHOP_NAME"       # display name, used in {shop_name} in ai_disclosure.txt
    etsy_shop_id_env: ETSY_SHOP_ID   # env var holding this shop's numeric Etsy shop_id
    niches: [stickers, coloring_pages, activity_sheets, stationery, ttrpg]
    default_price_usd:           # every pack size of a theme gets this price for now (no per-size rule yet)
      stickers: 3.50
      coloring_pages: 4.00
      activity_sheets: 4.00
      stationery: 4.50           # suggested; please confirm
      ttrpg: 4.50                # suggested; please confirm

# settings.niches decides which niches research knows, and QA's manifest_schema check refuses
# items whose niche is not listed here. generator / output only document each niche.
# pages_per_pack[0]: the pack size for a brief with neither pack_sizes nor page_count (older briefs).
niches:
  stickers:
    generator: image_api
    output: [png_transparent, sticker_sheet_pdf]
  coloring_pages:
    generator: image_api
    output: [pdf]
    pages_per_pack: [10, 20, 30]
  activity_sheets:
    generator: procedural        # reportlab only, no image model
    types: [maze, word_search, tracing, dot_to_dot]
    output: [pdf]
    pages_per_pack: [10, 20, 30]
  stationery:
    generator: procedural        # reportlab layouts; optional AI line-art accents (stationery.ai_accents)
    output: [pdf]
    pages_per_pack: [5, 20]
  ttrpg:
    generator: procedural        # reportlab only; optional AI line-art accents (ttrpg.ai_accents)
    output: [pdf]
    pages_per_pack: [5, 20, 30]

models:
  text:
    provider: anthropic          # documentation only (not read by code): the listing stage always uses Anthropic
    model: claude-opus-5-5
    max_tokens: 16000            # Opus thinks before answering and thinking counts toward max_tokens
  image:
    provider: google_gemini
    model: gemini-nano-banana-2.1    # Nano Banana 2.1 (stable); Imagen 4 is deprecated
    # called via client.models.generate_content (not generate_images)
    image_size_coloring: "4K"     # 1K / 2K / 4K; needs ~2550x3300 px for Letter at 300 DPI
    image_size_sticker: "2K"
    api: gemini                  # "gemini" (GOOGLE_API_KEY) or "vertex" (GOOGLE_CLOUD_PROJECT)
    aspect_ratio_coloring: "3:4"
    aspect_ratio_sticker: "1:1"
  recraft:                       # documentation only: no code reads this block yet
    enabled: false               # OFF until a paid plan is chosen: free-plan images are Recraft-owned,
                                 # public, and not licensed for commercial use. API units are prepaid.
                                 # Confirm API-output ownership in Recraft's API terms before enabling.
    use_for: [vectorize]         # options: vectorize, remove_background, generate_vector
    token_env: RECRAFT_API_TOKEN

vectorize:
  coloring_pages:
    preprocess: {grayscale: true, threshold: 180, despeckle_px: 20, min_line_px: 4}
    tracer: potrace              # potrace | vtracer_binary
  stickers:
    background_removal: rembg
    # tracer / vtracer are not read by code yet (stickers ship as PNGs; the binary vtracer
    # comparison in generators/imaging/cleanup.py uses its own fixed parameters).
    tracer: vtracer
    vtracer: {colormode: color, mode: spline, filter_speckle: 4, corner_threshold: 60, path_precision: 8}

print:
  dpi: 300
  page_sizes:
    us_letter: {width_in: 8.5, height_in: 11.0}
    a4: {width_in: 8.2677, height_in: 11.6929}   # ISO 210 x 297 mm
  deliver_both_sizes: true
  margin_in: 0.5
  min_line_weight_pt: 1.5        # coloring pages: thinner lines get flagged in QA

research:
  inputs_dir: data/research_inputs
  briefs_dir: data/briefs
  source_tool: auto              # auto-detect eRank / EverBee columns via aliases (research/columns.py)
  min_listings_per_pattern: 10   # compliance: never brief from fewer than 10 listings (values < 10 are raised to 10)
  min_shops_per_pattern: 3       # listing-level support must come from >= 3 different shops (counted, never saved); values below 3 are raised to 3
  briefs_per_niche: 5            # top N non-overlapping themes per niche become briefs
  keywords_per_brief: 10
  column_overrides: {}           # canonical column -> header(s), e.g. {search_volume: "Searches (US)", sales: ["Est. Mo. Sales"]}
  # Niche per row: regexes on lowercase, punctuation-free title/keyword/category text.
  # Most matching rules wins; ties go to the niche listed first. "<niche>__*.csv" file names override.
  niche_rules:
    stickers: ['\bstickers?\b', '\bclip ?art\b', '\bsticker (sheets?|packs?|bundles?)\b']
    coloring_pages: ['\bcolou?ring\b', '\bcolou?r (by|in) (numbers?|the)\b']
    activity_sheets: ['\bmazes?\b', '\bword ?(search|find)(es)?\b', '\btracing\b', '\bdot ?to ?dots?\b',
                      '\bconnect the dots\b', '\bworksheets?\b', '\bactivit(y|ies)\b', '\bbusy book\b']
  # niche_rules lists 3 niches; stationery and ttrpg rules come from research/niches.py
  # DEFAULT_RULES (deep-merged per niche). Do not add shorter copies of them here.
  extra_stopwords: []            # words/phrases never used as themes, on top of research/text.py
  # Pack sizes (docs/PACKS.md section 2): every brief gets base_pack_sizes plus the top sellers'
  # sizes, each kept within packs.min_size / packs.max_size.<niche> (the packs: block below).
  base_pack_sizes: [5, 20]
  top_sellers: {quantile: 0.75, min_rows: 5, second_share: 0.3}   # top quartile by sales (else favorites), 5+ rows
  opportunity_weights: {demand: 0.4, sales_per_listing: 0.3, low_competition: 0.3}   # renormalized over the metrics the data has
  system_share: 0.5              # ttrpg: brief "system" = the registry id named by >= this share of the theme's
                                 # clean rows, else "generic" (the brief stores the id, never the name)
  # Not set here on purpose (YAML lists replace defaults): niche_stopwords, niche_keep_words,
  # niche_connectors, excluded_terms and medical_terms live in research/defaults.py
  # (medical_terms: settings can add, never remove). Research reads listing.medical_ok_phrases
  # when it is set, else its own copy of the listing defaults.
  price_clamp: {min_factor: 0.75, max_factor: 1.5, step_usd: 0.25}       # median price clamped to x shop default
  own_shop_boost: 0.1            # own_shop*.csv: closes up to 10% of a theme's gap to demand 1.0 (never counted)
  trend_boost: 0.1               # trends*.csv: same, from interest 0-100 (never counted)
  blocked_cooccurrence: {flag_share: 0.2, drop_share: 0.5}   # share of a theme's rows naming a blocked term
  # Research history (docs/SERVER.md section 3): `python -m service research` writes
  # data/history/<date>/<niche>.json here. Gitignored, never committed, never sent to a model.
  history_dir: data/history
  history:
    min_rows: 3                  # a near-miss theme needs this many clean rows of one kind (listing rows, or counted keyword rows); empty = default
    max_themes: 200              # themes kept per snapshot, best demand first (qualified themes are never cut first); empty = default
  # Evidence window (docs/SERVER.md section 12): briefs use only market exports and trend files
  # received within window_days of the run date (date from the ingest name, else
  # data/research_inputs/.ingested.json, else the file time). Own-shop stats are not windowed.
  window_days: 35                # empty = default
  keep_days: 180                 # the service deletes accepted exports received longer ago (never fewer
                                 # days than window_days); their sha256 stays in .ingested.json marked "deleted"
  kdp_keep_days: 90              # book (KDP/BookBeam) files the inbox routed to data/research_inputs/kdp/ are
                                 # deleted this many days after they were received (0 = keep; docs/RESEARCH_COSTS.md
                                 # section 5). Their sha256 stays in .ingested.json marked "deleted".
  # Research stage (docs/SERVER.md section 8): auto | discovery | refined. auto = refined once the
  # shop has stages.refined.after_drafts real Etsy drafts (publish.json with listing_id, not dry_run).
  # Discovery uses min_listings_per_pattern / min_shops_per_pattern / own_shop_boost above.
  stage: auto
  stages:
    refined:
      after_drafts: 20
      min_listings: 15           # brief support, patterns and tags; never below 10 or min_listings_per_pattern
      min_shops: 3               # never below 3 or min_shops_per_pattern
      min_weeks_seen: 3          # briefs only: seen (fresh_rows >= history.min_rows) in this many ISO weeks, this run included
      demand_not_falling: true   # briefs only: refuse when listing (or keyword) rows or demand rank fell by more than falling_tolerance
      falling_tolerance: 0.10
      own_shop_boost: 0.25       # used instead of research.own_shop_boost (0.1) in the refined stage
  # Not set here on purpose (lists in YAML replace the defaults): excluded_terms (platform and
  # planner brands), extra_blocked_terms / extra_review_terms (a stricter-only supplement to
  # config/trademark_blocklist.txt) live in research/defaults.py DEFAULTS.
  # style_notes / default_style_notes (research/defaults.py) end up in each brief. The image
  # generators use only the clauses listed in generators/imaging/prompts.py STYLE_CLAUSES;
  # any other clause is left out of the prompt and marks the item for review, so a custom
  # style_notes needs matching STYLE_CLAUSES entries.

compliance:
  trademark_blocklist: config/trademark_blocklist.txt
  ai_disclosure: config/ai_disclosure.txt
  # Health topics (docs/HEALTH_TERMS.md "Decided 2026-10-17"): medical topics are hard blocked,
  # "?" borderline topics go to review, labelled "(health topic)". Read by Blocklist.load next
  # to trademark_blocklist; the file path is also the default when this key is absent.
  health_terms: config/health_terms.txt
  publisher_mode: draft_only     # never change; the user activates listings in Etsy. The pipeline
                                 # refuses its publish stage unless this is draft_only.

listing:
  title_max_chars: 140           # Etsy Help Center (core/etsy.py); the publisher caps these at Etsy's limits
  tags_count: 13
  tag_max_chars: 20
  alt_text_max_chars: 500        # Open API v3 uploadListingImage alt_text: "Max length 500 characters."
  always_disclose_ai: true       # the listing copy itself is AI-written, so disclose even on procedural activity sheets
  quantity: 999
  taxonomy_ids:                  # Etsy seller taxonomy id per niche; createDraftListing requires one. null = not chosen yet
    stickers: null
    coloring_pages: null
    activity_sheets: null
    stationery: null
    ttrpg: null
  # medical_terms / misleading_phrases can only be added to and medical_ok_phrases can only
  # shrink (listing.listing_config); their lists live in listing DEFAULTS.
  max_retries: 2                 # times the model is asked again with the rule errors before the code repairs the draft
  effort: low                    # Opus 5.5 always thinks, and thinking counts toward models.text.max_tokens
  refusal_fallback: true         # server-side fallback model if a request is declined (beta server-side-fallback-2026-07-01, fallbacks: default)
  terms: "For personal use only. Please do not share, resell or redistribute the files or printed copies."

paths:
  output_dir: output
  review_dir: output/review

# --- Orchestrator (python -m pipeline) ---
pipeline:
  max_items_per_run: 10          # caps image/API spend per run (items reused from earlier runs count too)
  dry_run_output_dir: output/dry-run   # --dry-run without --out writes here: the pipeline and every stage
                                       # CLI (generators, qa, listing, publisher publish) use it
  max_brief_age_days: 6          # live runs skip the newest brief file of a niche older than this (from the
                                 # date in its name), so the weekly Action drafts each committed brief file
                                 # once. Keep it below 7. null = off. Files named with --brief are exempt.
  theme_cooldown_days: 60        # skip a brief when the shop already has an item with the same theme made
                                 # within this many days, or one with a real Etsy draft at any age
                                 # (docs/SERVER.md section 13). null or 0 = only real drafts block.
                                 # --regenerate lifts the days, never a real draft. Not a number = 60.

# --- Themed packs: generators/packs (docs/PACKS.md section 3). Defaults: generators/packs/model.py
# DEFAULTS; research keeps brief pack sizes within min_size / max_size (research/defaults.py PACK_BOUNDS). ---
packs:
  min_size: 5                      # smallest pack a brief may name
  max_size: {stickers: 60, coloring_pages: 50, activity_sheets: 50, stationery: 60, ttrpg: 40}
  fresh_every: {5: 3, 20: 6}       # out of every N packs of a size, the Nth gets new pages; the others are cut
                                   # from the theme's master set (the brief's largest size: always new pages)
  fresh_every_default: 0           # other sizes: never forced fresh
  state_file: data/packs_state.json   # pack counters for paths.output_dir (gitignored); other output roots
                                      # (dry runs, --out) keep <out>/sets/packs_state.json, so a dry run
                                      # never moves the real counters
  min_quality: 0.5                 # curation: weaker pages are picked only when nothing else is left
  preview_pages: 8                 # page previews per item (QA's mockup grid shows up to 8)
  dry_run_fake_long_side_px: 640   # dry runs: FakeImageClient size (the smaller of this and imaging.fake_long_side_px)
  subjects:                        # subject planning with the text model (models.text.model)
    use_model: true                # false: built-in subject tables only (dry runs always use the tables)
    effort: low
    refusal_fallback: true         # server-side fallback (fallbacks: "default") when the request is declined
    extra: 6                       # ask for this many more than needed (some are filtered out)
    max_chars: 80
    max_tokens: 8000

# --- 24/7 server: python -m service (docs/SERVER.md). Defaults: service/paths.py,
# service/searchlist.py and service/cleanup.py DEFAULTS. Research history folder: research.history_dir above.
# On the server, put server-only values (service.live: true, spend.monthly_cap_usd) in
# config/settings.local.yaml, which setup.sh creates and never overwrites (docs/SERVER.md section 14). ---
service:
  inbox_dir: /srv/botsy-inbox      # SFTP chroot of botsy-upload (root-owned, mode 755)
  incoming_subdir: incoming        # the Windows helper uploads <name>.part, then renames it
  outbox_subdir: outbox            # status.txt, status.json, search-list.txt (the helper reads them)
  rejected_dir: data/inbox_rejected
  lock_file: data/.service.lock
  live: false                      # false = dry runs: no API calls, no Etsy drafts. Only a real `true` goes live.
  max_upload_bytes: 25000000       # matches max_upload_bytes in the Windows helper's helper.json
  part_max_age_h: 48               # an unfinished <name>.part this old was given up on and is deleted (0 = never)
  lock_timeout_s: 1800             # a second service command waits this long, then exits with code 3
  settle_s: 300                    # after an accepted upload, wait until the inbox is quiet this long (one research run per batch)
  settle_max_s: 3600               # never wait longer than this
  max_rounds: 3                    # research + run again for uploads that finish during a run
  status_keep_days: 35             # tick records kept in outbox/status.json
  rejected_max_mb: 200             # data/inbox_rejected/ holds at most this much; oldest removed first (0 = no cap)
  rejected_keep_days: 30           # rejected uploads and their reason files older than this are removed (0 = keep).
                                   # Only files ingest named <YYYY-MM-DD>-<name> are ever removed.
  dry_run_keep_days: 14            # output/dry-run/ practice items and run summaries older than this are removed (0 = keep)
  performance_keep_days: 400       # data/performance/etsy/ and reviews/ daily files older than this are removed (0 = keep)
  sales_files_keep_days: 90        # data/performance/sales/ daily files older than this are removed (0 = keep)
  # Event journal and memories between ticks (docs/SERVER.md section 9; defaults: core/events.py, service/tick.py)
  events_file: data/events.jsonl   # what the server did, one JSON line per event (the daily log is built from it)
  events_max_mb: 5                 # rotate to events-1.jsonl ... events-5.jsonl at this size
  events_keep: 5                   # rotated event files kept (copies beyond this are removed at the next rotation)
  state_file: data/.service_state.json   # last research stage, spending messages, review holds and problems already sent to Discord
  search_list:                     # outbox/search-list.txt, written every Saturday 09:07 New York time (docs/SERVER.md section 4)
    # instructions:                # the "What to do" lines at the top of search-list.txt; empty = default
    #                              # (service/searchlist.py INSTRUCTIONS). A list of lines, or one multi-line string, e.g.
    #   - "Etsy Marketplace Insights (free; 15 keyword searches a week on a standard account):"
    #   - "  1. In Etsy, open Shop Manager > Stats > Marketplace Insights and search for a line below."
    #   - "  2. Type the keyword, Etsy's Searches and Search Results numbers and today's date into"
    #   - "     Documents\\Botsy\\templates\\etsy-insights-template.csv (columns keyword, searches, competition, checked_on)."
    #   - "  3. File > Save As > CSV UTF-8 into Downloads with a new name; the helper uploads it."
    max_per_niche: 6               # search lines per niche; empty = default
    recheck_weeks: 2               # a qualified theme not seen in history for this long goes back on the list
    seeds:                         # our own starter searches, listed every week (no brand names: they get flagged); one phrase or a list
      coloring_pages: ["coloring pages for kids", "printable coloring pages"]
      stickers: ["digital stickers", "digital planner stickers"]
      activity_sheets: ["kids activity sheets", "printable mazes for kids"]
      stationery: ["adhd planner printable", "productivity planner pages"]
      ttrpg: ["ttrpg character sheet", "hex map paper printable"]
    nouns:                         # added after a theme name: "axolotl" -> "axolotl coloring pages"
      coloring_pages: coloring pages
      stickers: stickers
      activity_sheets: activity sheets
      stationery: planner pages
      ttrpg: rpg sheets
# The Windows helper has no section here: it runs on the PC and reads %APPDATA%\Botsy\helper.json
# (defaults: DEFAULTS in windows/botsy_helper.py; see windows/README.md).

# --- Botsy's clock and the Sunday plan schedule (user, 2026-10-17; docs/SERVER.md section 6,
# docs/OVERSEER.md "Scale-ups ... and the Sunday plan"; defaults: core/config.py SCHEDULE_DEFAULTS).
# Every time below is "Day HH:MM" on the wall clock of schedule.timezone. `timezone` sets the
# Discord quiet hours and the daily log's times and date; the systemd timers name
# America/New_York in their unit files. The plan_* keys are the weekly plan's schedule,
# used by service/plan.py and service/orders.py.
# Money months (the spending cap) and KDP weeks stay UTC. ---
schedule:
  timezone: America/New_York       # "8 pm EST" means 8 pm New York time all year (EDT in summer)
  plan_post: "Sun 20:00"           # the weekly plan is posted (botsy-plan.timer)
  reminders: ["Mon 08:00", "Mon 19:00"]   # first 4 plans: reminders while a plan waits for your approval
  deadline: "Tue 20:00"            # an unapproved plan expires; Botsy runs on its normal rules that week
  auto_start: "Mon 08:00"          # from plan 5: the plan starts by itself unless you press Hold
  revision_min_hours: 2            # a revised plan starts no sooner than this after the revision
  max_revisions: 3                 # Hermes may revise a plan this many times, then no plan that week
  approvals_before_auto: 0         # user, 2026-10-21: plans start by themselves from week 1 (Mon 8 am NY) unless you Hold
  auto_start_max_cost_share: 1.0   # user, 2026-10-21: plans of any cost start by themselves (the draft still paces money left over the weeks left)
  stale_skip_hours: 24             # a plan run that is later than this (server was off) is skipped
  upload_cutoff: "Sun 19:00"       # shown in messages only: export by then so the plan can use the research

# --- Weekly plan (docs/OVERSEER.md Part B; defaults: service/plan.py SETTINGS_DEFAULTS) ---
plan:
  enabled: true                  # false: no weekly plans at all; every check runs on the normal rules
  dir: data/plans                # state.json and data/plans/<week>/ (facts.json, plan.json, plan_due.json); gitignored
  max_packs: 12                  # packs in Botsy's own draft plan
  brief_max_age_days: 7          # a plan line whose brief is older than this is dropped (packs already made still go on)
  stale_days: 8                  # a plan older than this no longer steers the checks (normal rules)
  no_plan_after_minutes: 60      # "No plan this week" this long after schedule.plan_post (Sunday 21:00)
  max_cost_usd: null             # an extra ceiling for Botsy's draft, in dollars (null: none)
  first_check_lock_wait_s: 120   # a plan start waits this long for a running check; else the next hourly checks try again (3 tries in all)
  hermes_events_url: null        # Hermes's local webhook route for the signed plan_due event: http://127.0.0.1:PORT/... only (no 'localhost', no redirects, no proxy)
  notify: true                   # post the plan messages to Discord (service/notify.py)

# --- Orders and the admin-only limits file (docs/OVERSEER.md "Four permission levels";
# docs/CONTRACTS.md section 8; defaults: service/limits.py, service/orders.py). No codes
# (decided 2026-10-21): Level 3 approvals come straight from you (server CLI) or Hermes (your
# allowlisted Discord user), at most limits level3_per_day a day, each posted at once to the
# main Discord channel (DISCORD_WEBHOOK_URL) with who asked and how to undo it. ---
control:
  limits_path: /etc/botsy/limits.yaml        # admin-only (root:root 0644, a real file, not a link); Botsy never writes it. Missing or broken = Level 2 changes and scale-ups off
  limits_require_root: true                  # the file (checked again once opened) and its folder must be root's and not writable by others
  orders_dir: data/orders                    # accepted orders (data/orders/<week>/<id>.json) and counters.json
  state_file: data/control/state.json        # pause flag, cap in force (raise/lower orders), budget stop; written only by service/orders.py (a damaged one is kept as state.json.unreadable-<UTC>)
  winners_file: data/performance/winners.json   # scale-ups stay refused (no_winners_yet) until this exists AND limits scale_up.enabled is true
  log_file: data/logs/botsy-control.log      # botsy-control (Hermes's MCP tools) base name; each server writes botsy-control-read.log / -act.log next to it (tool name, ok, reason codes; never an argument)

# --- Discord messages and the daily log (docs/SERVER.md section 11; defaults: service/notify.py) ---
notify:
  discord:
    enabled: true                  # also needs DISCORD_WEBHOOK_URL in .env (deploy/lightsail/README.md, step 11)
    events: [draft_created, held_for_review, export_rejected, budget_reached, spend_warning,
             token_expiring, stage_changed, error, search_list_written]   # kinds that post right away (one message per tick)
    digest: true                   # post the daily log (python -m service digest, every day at 07:07 New York time)
    timeout_s: 10
    max_retry_wait_s: 60           # longest wait for Discord's retry_after on HTTP 429
  quiet_hours: ["22:00", "07:00"]  # in schedule.timezone (New York); other messages wait for the morning's daily log
  urgent: [budget_reached, error, order_approved, plan_approved, plan_mode_changed]  # sent even during quiet hours (approvals are always posted at once)

# --- Spending tracker (docs/SERVER.md section 10; defaults: core/spend.py). Costs are estimates;
# your provider bills are what count. ---
spend:
  ledger_file: data/spend/ledger.jsonl   # one line per paid API call (gitignored)
  monthly_cap_usd: 25            # dollars per calendar month (UTC) (user, 2026-10-16). null or 0 = no cap.
                                 # At the cap, paid AI calls stop until next month or until you raise it.
                                 # With a cap set, paid calls also pause if the ledger cannot be written.
                                 # On the server, set it in config/settings.local.yaml.
  warn_at: 0.8                   # a warning goes out once a month when spending passes 80% of the cap
  prices_max_age_days: 180       # the log warns when prices.checked is older than this
  prices:
    checked: "2026-10-16"        # the date the prices below were last checked (YYYY-MM-DD)
    # A dated snapshot of a listed model (claude-opus-5-5-20261001) uses that model's price.
    # Any other model not listed here is charged at the highest rates listed for its provider.
    # Anthropic, USD per million tokens. Source: platform.claude.com/docs/en/about-claude/pricing
    # and the claude-api skill model table, checked 2026-10-16. Thinking tokens are billed as output
    # tokens (usage.output_tokens includes them). Opus 5.5 cache reads are $0.20 per million; the
    # listing stage sends no cache_control, so cache prices never apply. With the refusal fallback,
    # each model that ran is recorded at its own price (usage.iterations).
    anthropic:
      claude-opus-5-5: {input_per_mtok: 4.00, output_per_mtok: 20.00}
      claude-opus-5: {input_per_mtok: 5.00, output_per_mtok: 25.00}     # possible refusal fallback
      claude-opus-4-8: {input_per_mtok: 5.00, output_per_mtok: 25.00}   # possible refusal fallback
      claude-fable-5-1: {input_per_mtok: 10.00, output_per_mtok: 50.00}
      claude-sonnet-5-5: {input_per_mtok: 2.00, output_per_mtok: 10.00}
      claude-haiku-5-5: {input_per_mtok: 0.10, output_per_mtok: 0.50}   # prompts up to 100K tokens
    # Google, USD. Source: ai.google.dev/gemini-api/docs/pricing (Gemini API paid tier, standard,
    # not batch), checked 2026-10-16. Images are $30 per million output tokens: 1,120 / 1,680 /
    # 3,780 tokens per 1K / 2K / 4K image. Vertex AI prices may differ.
    google:
      gemini-nano-banana-2.1:
        input_per_mtok: 1.50     # text prompt
        output_per_mtok: 7.50    # text and thinking output
        per_image: {"1K": 0.0336, "2K": 0.0504, "4K": 0.1134}   # Google rounds 4K to $0.113

# --- Per-stage tuning. Defaults live in each module's DEFAULTS dict; these override them. ---

activity_sheets:
  difficulty: auto               # easy | medium | hard | auto (auto: youngest age in brief audience <= auto_easy_max_age -> easy, else medium; brief["difficulty"] overrides if valid)
  auto_easy_max_age: 5
  max_pages: 100                 # sanity cap on a brief's page_count
  levels:
    easy:
      maze: {cols: 8, rows: 10}
      word_search: {words: 8, max_size: 10, directions: [right, down]}
      dot_to_dot: {dots: 20}
    medium:
      maze: {cols: 12, rows: 15}
      word_search: {words: 12, max_size: 13, directions: [right, down, down_right]}
      dot_to_dot: {dots: 35}
    hard:
      maze: {cols: 16, rows: 20}
      word_search: {words: 15, max_size: 15, directions: [right, down, down_right, up_right, left, up, up_left, down_left]}
      dot_to_dot: {dots: 50}
  tracing: {style: gray, letters_per_page: 2, numbers_per_page: 5, words_per_page: 5}   # style: gray (light filled letters) | dotted (dotted outlines)
  dot_to_dot: {faint_preview: false}   # true = faint dashed outline under the dots
  answer_key_grid: [2, 2]        # answer keys per page (cols x rows); answer pages are not counted in page_count
  preview_pages: 6
  preview_dpi: 150
  footer_text: "For personal use only. Please do not share, resell or redistribute this file."

# --- Image generators (generators/imaging, generators/coloring_pages, generators/stickers) ---
# Defaults live in each module's DEFAULTS dict; these blocks document and override them.
imaging:
  max_images_per_run: 80        # hard cost cap per process (CLI run or pipeline run). A pack that cannot
                                # fit in what is left fails BEFORE any image is generated.
  max_retries: 5                # retries on 408/429/5xx/network errors (the google-genai SDK does not retry by default)
  backoff_base_s: 2.0           # delay = base * 2**attempt, capped at backoff_max_s, plus 0..jitter random
  backoff_max_s: 60.0
  backoff_jitter: 0.25
  timeout_s: 300                # per request; 4K images are slow
  response_modalities: [IMAGE]  # image only; we never use the model's text
  vertex_location: global       # used when models.image.api = vertex and GOOGLE_CLOUD_LOCATION is unset
  fake_long_side_px: 1200       # dry-run FakeImageClient image size

coloring_pages:
  default_pages: 20             # brief has no page_count and niches.coloring_pages.pages_per_pack is unset
  max_pages: 50
  spare_subjects: 3             # extra planned subjects that replace refused or blank images
  max_failures: 3               # more refused/blank images than this fails the item
  pad_frac: 0.03                # white margin kept around the art when cropping
  max_ink_fraction: 0.45        # more black than this looks like shading, so the item is marked needs_review
  vector_in_pdf: true           # place the potrace SVG; false places the cleaned raster
  preview_dpi: 150
  footer_text: ""               # optional small line at the bottom of every page

stickers:
  default_count: 12             # brief has no page_count (= sticker count)
  max_count: 60                 # textured 2K art is ~1-2.5 MB per PNG; past ~24 stickers the ZIP parts plus
                                # sheet PDFs can exceed Etsy's 5 files (item is then marked needs_review)
  spare_subjects: 3
  max_failures: 3
  sticker_px: 1500              # long side of the artwork before the border (5 in at 300 dpi)
  die_cut_border_px: 36         # white die-cut border, at sticker_px scale
  border_color: [255, 255, 255]
  shadow: false                 # optional soft drop shadow
  shadow_offset_px: 8
  shadow_blur_px: 10
  shadow_opacity: 0.3
  floodfill_tolerance: 24       # dry-run / floodfill background removal
  rembg_model: isnet-general-use  # NOT rembg's default "bria-rmbg" (RMBG-2.0 is CC BY-NC 4.0, non-commercial)
  min_island_px: 400            # detached specks smaller than this are dropped before the border
  sheet: {cols: 3, rows: 4, gap_in: 0.25}   # sticker sheet grid per page, with cut spacing
  sheet_jpeg_quality: 92        # sheet PDFs: stickers flattened on white as JPEG (~10x smaller); null = lossless
  zip_max_mb: 19.0              # PNG ZIP is split into -part-N.zip files below Etsy's 20 MB per-file limit
  preview_dpi: 150
  preview_stickers: 4
  preview_background: checker   # checker | white
  preview_px: 800
  footer_text: ""

# --- Procedural planner pages (generators/stationery) and tabletop RPG sheets (generators/ttrpg).
# Defaults live in each package's DEFAULTS; packs.max_size.<niche> wins over max_pages when set.
# Printed text never below 7 pt and writing lines never closer than 6 mm (QA checks both). ---
stationery:
  max_pages: 60                  # largest pack
  min_font_pt: 7.0               # smallest printed text (never below 7)
  min_line_gap_mm: 6.0           # writing lines, rows and grids at least this far apart (never below 6)
  light_line_pt: 0.6             # writing and grid lines (never below 0.5)
  structural_line_pt: 0.0        # box borders; 0 = print.min_line_weight_pt
  color_zones: true              # light print-friendly tints in zone headers (false: light gray)
  week_start: auto               # auto (US Letter: Sunday, A4: Monday) | monday | sunday
  clock: 12h                     # schedule labels: 12h ("7 am") | 24h ("07:00")
  day_start_hour: 7              # first hour on schedules
  grid_pitch_mm: 6.35            # dot and square grids (a quarter inch)
  unique_type_share: 0.8         # share of a pack's pages that are different page types
  preview_dpi: 150
  footer_text: "For personal use only. Please do not share or resell this file."
  ai_accents: false              # optional AI line-art accents (real runs only, uses the image client)
  accent_images: 2               # accent images per design set
  accent_image_size: "1K"
  accent_max_failures: 2
  accent_box_in: 0.95            # printed accent size (also the procedural motif slot)
  accent_threshold: 180
  accent_despeckle_px: 12

ttrpg:
  systems_file: config/ttrpg_systems.yaml   # game-system registry (core/systems.py): names, owner, disclaimer, sheet fields
  max_pages: 40
  min_font_pt: 7.0               # never below 7
  min_line_gap_mm: 6.0           # never below 6
  line_gap_mm: 7.0
  row_gap_mm: 6.4
  light_line_pt: 0.6             # never below 0.5
  structural_line_pt: 1.0
  frame_line_pt: 1.6
  tints: true
  default_genre: classic_fantasy
  preview_dpi: 150
  footer_text: "For personal use only. Please do not share or resell this file."
  ai_accents: false              # optional AI line-art accents (real runs only)
  accent_images: 2
  accent_image_size: "1K"
  accent_max_failures: 2
  accent_box_in: 0.36
  accent_threshold: 180
  accent_despeckle_px: 12

# Existing key, now documented: vectorize.stickers.background_removal accepts rembg | floodfill
# (floodfill suits the "plain solid white background" prompt and needs no model download).

qa:
  # Etsy's digital-file limits (5 files, 20 MB each) live only in core/etsy.py.
  page_size_tolerance_pt: 1.0
  dpi_tolerance: 0.02            # 2480 px across A4 still counts as 300 DPI
  blank_check_dpi: 36
  blank_min_ink: 0.002           # share of non-white pixels below which a page counts as blank
  black_max_ink: 0.85            # share of dark pixels above which a page counts as solid black
  line_check_dpi: 200            # coloring pages: render for line weight / black-white / region checks
  line_check_max_pages: 40
  gray_max_fraction: 0.005       # coloring pages: share of mid-gray pixels allowed
  min_regions: 3                 # enclosed areas to color per page (warning only)
  packs:                         # perceptual-hash distance out of 64 bits (image niches)
    duplicate_distance: 3        # this close or closer: the pack fails (duplicate page)
    near_distance: 6             # this close or closer: the item goes to review
  print_rules:                   # stationery and ttrpg (docs/PACKS.md section 5)
    min_font_pt: 7.0
    font_tolerance_pt: 0.05
    min_line_gap_mm: 6.0
    line_gap_tolerance_mm: 0.4
    dpi: 150                     # render for the writing-line spacing estimate
    dark_level: 235
    light_level: 90              # writing lines are light gray; darker lines are borders
    min_run_mm: 20
    max_pages: 60
  mockups:
    enabled: true
    width: 2700                  # 4:3; Etsy recommends at least 2000 px on both sides
    height: 2025
    quality: 90                  # JPEG quality; stepped down (not below 70) to fit max_bytes
    max_bytes: 1000000           # Etsy Help Center: listing images over 1 MB may not finish uploading
    min_count: 5
    fonts: []                    # optional .ttf/.otf paths tried before the system fonts (never downloaded)
    pack_badge: true             # "20 PAGES" / "SET OF 5" on the cover photo (on the title card's corner)
    desk_niches: [stationery, ttrpg]   # sixth photo: printed pages on a desk

publisher:
  # Etsy Open API v3, our own shop, DRAFTS ONLY (all keys and defaults: publisher/defaults.py)
  # listings_d is used only by `python -m publisher discard` on drafts this tool created;
  # remove it to forbid deletes entirely. A list here replaces the default list, so
  # transactions_r must be listed here too (user approved 2026-10-17: our own sales via
  # getShopReceiptTransactionsByShop; publisher/sales.py keeps only listing_id, day, quantity,
  # price). Re-run `python -m publisher auth` once to grant it.
  scopes: [listings_r, listings_w, listings_d, shops_r, transactions_r]
  # Own-shop performance files (docs/CONTRACTS.md section 7), gitignored. Dry runs write the same
  # tree under pipeline.dry_run_output_dir/performance.
  performance_dir: data/performance
  sales_keep_days: 90          # local days kept, today included (rolling window)
  sales_max_pages: 50          # getShopReceiptTransactionsByShop has no date filter: page cap
  currency: USD                # listing.json prices are USD; a shop in another currency is refused
  min_price_usd: 0.20          # Etsy's price range (USD 0.20 - 50,000)
  max_price_usd: 50000
  max_quantity: 999            # Etsy: at most 999 units per listing
  max_images: 20               # spec: a listing holds up to 20 images
  extra_fields: {}             # extra createDraftListing fields, e.g. {shop_section_id: 123, should_auto_renew: false}
  retries: 4                   # per request, for 429 / 5xx (never 5xx on createDraftListing or file uploads)
  backoff_s: 2.0               # exponential: 2, 4, 8, 16 s (at least Retry-After)
  max_wait_s: 120              # a longer Retry-After (daily quota spent) fails instead of sleeping
  own_stats_file: data/research_inputs/own_shop_stats.csv
# The publisher also reads listing.taxonomy_ids.<niche> (already a key in the listing stage's DEFAULTS)
# as a fallback when listing.json has taxonomy_id: null. Fill it with ids from `python -m publisher taxonomy --search ...`.
# Multi-shop (optional keys on each entry under `shops:`): etsy_token_file_env (default ETSY_TOKEN_FILE)
# and etsy_refresh_token_env (default ETSY_REFRESH_TOKEN). Each Etsy shop belongs to a different
# Etsy user, so a second shop needs its own token file. Keep "etsy_tokens" in its file name
# (e.g. .etsy_tokens_second.json) so .gitignore keeps it out of git, e.g.
#   - id: second
#     etsy_shop_id_env: ETSY_SHOP_ID_SECOND
#     etsy_token_file_env: ETSY_TOKEN_FILE_SECOND
#     etsy_refresh_token_env: ETSY_REFRESH_TOKEN_SECOND
