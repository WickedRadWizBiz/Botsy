# Game systems a tabletop RPG sheet can be made for (docs/PACKS.md section 1).
# Read and validated by core/systems.py; the ttrpg generator, research and the listing stage
# use it through that module only.
#
# CLAUDE.md exception (user, 2026-10-16): a ttrpg listing may name the game system its sheets
# are made for, as a compatibility reference only ("Character Sheet for D&D 5e"), in that
# listing's title, tags and description, never on printed pages, file names, prompts or
# mockups, and always with the system's "unofficial, not affiliated with <owner>" disclaimer.
#
# Each system:
#   id           stable id stored in briefs and manifests (never trademark text)
#   label        how a listing names the system ("... for D&D 5e")
#   names        how the system may appear in listing text (detection; the label first)
#   owner        the trademark owner, named in the disclaimer
#   owner_names  other spellings of the owner (detection)
#   disclaimer   appended to every listing that names the system
#   sheet_fields OUR OWN field list, from the game mechanics only, in generic wording. It
#                only decides which fields a sheet has; layouts, art and wording are ours.
#                Never official sheet layouts, logos, art, setting names or product-identity
#                creatures. A missing group (core, details, spells, combat, currency,
#                spell_card) is taken from the default system.
#
# Section kinds (generators/ttrpg/flow.py): lines (write-in lines with labels under them),
# scores (big score boxes, optional sub boxes), boxes (small labeled boxes), checklist (a
# bubble, a label and value boxes per row; marks = proficiency letters), track (rows of
# checkboxes), table (columns and writing rows), slots (per-level checkboxes), notes (lined
# area), prompts (labeled lined fields). span: full = across the page.
schema: ttrpg_systems/v1
default: generic

systems:
  - id: generic
    label: System-Neutral
    names: []
    owner: null
    disclaimer: ""
    sheet_fields:
      combat: {order: Initiative, defense: Defense, health: Health}
      currency: [Coins, Gems, Trade Goods, Other]
      spell_card: [Tier, Cost, Range, Duration]
      core:
        - {kind: lines, fields: [Character Name, Role or Class, Level, Origin, Player, Campaign], cols: 3}
        - {kind: scores, title: Attributes, fields: [Might, Agility, Endurance, Intellect, Insight, Presence], sub: [Modifier]}
        - {kind: boxes, title: Vitals, fields: [Health, Defense, Speed, Initiative, Resolve, Experience], cols: 3}
        - {kind: track, title: Conditions, fields: [{label: Wounds, count: 5}, {label: Fatigue, count: 5}]}
        - {kind: table, title: Skills and Talents, columns: [Skill, Rank, Bonus], weights: [4, 1, 1], rows: 9}
        - {kind: table, title: Attacks and Actions, columns: [Action, Bonus, Effect], weights: [3, 1, 3], rows: 4}
        - {kind: notes, title: Abilities and Traits}
      details:
        - {kind: lines, fields: [Character Name, Player], cols: 2}
        - {kind: notes, title: Proficiencies and Languages, lines: 4}
        - {kind: boxes, title: Wealth, fields: [Coins, Gems, Trade Goods, Other], cols: 4}
        - {kind: table, title: Equipment, columns: [Item, Qty, Notes], weights: [4, 1, 3], rows: 8}
        - {kind: prompts, title: Personality, fields: [Traits, Goals, Bonds, Fears], lines: 2}
        - {kind: notes, title: Features and Traits}
        - {kind: notes, title: Allies and Contacts}
      spells:
        - {kind: lines, fields: [Character Name, Power Source], cols: 2}
        - {kind: boxes, title: Power Stats, fields: [Power Stat, Save Target, Power Bonus, Power Points], span: full}
        - {kind: slots, title: Uses by Tier, levels: 5, boxes: 4, label: Tier, span: full}
        - {kind: table, title: Abilities and Powers, columns: [Tier, Name, Cost, Notes], weights: [1, 4, 1, 4], rows: 8, span: full}

