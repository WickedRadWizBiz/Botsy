# Botsy upload account: SFTP only, locked into /srv/botsy-inbox (docs/SERVER.md section 1).
# setup.sh installs this as /etc/ssh/sshd_config.d/botsy-upload.conf and checks it with
# `sshd -t` before reloading SSH. It changes nothing for any other account (your own
# login, or Lightsail's browser SSH).
#
# - ChrootDirectory: the account sees /srv/botsy-inbox as "/" (incoming/ and outbox/ only).
# - ForceCommand internal-sftp: file transfer only, never a shell or a command.
#     -u 0027: uploaded files are readable by group botsy (the server) and nobody else.
#     -P ...: no links, server-side copies, folders or permission changes (setstat), so
#     the account cannot lock the server out of incoming/.
#     The Windows helper only needs put, rename and get.
# - Key login only, with the key in a root-owned file the account cannot change.
Match User botsy-upload
    ChrootDirectory /srv/botsy-inbox
    ForceCommand internal-sftp -u 0027 -P symlink,hardlink,copy-data,mkdir,setstat,fsetstat,lsetstat
    AuthorizedKeysFile /etc/ssh/botsy-upload/authorized_keys
    AuthenticationMethods publickey
    PasswordAuthentication no
    KbdInteractiveAuthentication no
    PubkeyAuthentication yes
    AllowTcpForwarding no
    AllowAgentForwarding no
    AllowStreamLocalForwarding no
    X11Forwarding no
    PermitTunnel no
    PermitTTY no
    PermitUserRC no
    DisableForwarding yes
