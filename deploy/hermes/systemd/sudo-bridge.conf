# hermes-gateway.service.d/sudo-bridge.conf: only with  install_hermes.sh --bridge sudo
# (the fallback; the default is the socket bridge, which needs none of this).
# Hermes then starts botsy-control itself with  sudo -n -u botsy /usr/local/bin/botsy-control-read
# (and -act), allowed by /etc/sudoers.d/botsy-control. sudo is setuid root, so this drop-in turns
# off what would stop it: no_new_privs, the system-call filter and every other setting that implies
# no_new_privs for a non-root service, and the empty capability bounding set. botsy-control then
# runs inside Hermes's sandbox, so Botsy's folders must be visible and /opt writable again.
# Botsy's folders stay closed to the hermes user by their permissions (check_lock.py checks).
[Service]
NoNewPrivileges=no
SystemCallFilter=
SystemCallArchitectures=
SystemCallErrorNumber=
RestrictAddressFamilies=
RestrictNamespaces=no
PrivateDevices=no
ProtectKernelTunables=no
ProtectKernelModules=no
ProtectKernelLogs=no
ProtectClock=no
RestrictSUIDSGID=no
RestrictRealtime=no
LockPersonality=no
CapabilityBoundingSet=
CapabilityBoundingSet=CAP_SETUID CAP_SETGID CAP_SETPCAP CAP_AUDIT_WRITE CAP_CHOWN CAP_DAC_OVERRIDE CAP_FOWNER CAP_SYS_RESOURCE
ProtectSystem=full
InaccessiblePaths=
InaccessiblePaths=-/usr/local/lib/botsy -/usr/local/lib/botsy-hermes -/root
