#!/usr/sbin/nft -f
# Egress limit for the hermes user (required since 2026-10-21: install_hermes.sh always installs
# it; docs/OVERSEER.md "Lock-down", layer 2). Scheduled-job URL monitors, kanban_attach_url and
# vision can each be handed a web address, and this table is what keeps them off the open web. Installed as /usr/local/lib/botsy-hermes/nftables-hermes.conf and loaded
# by botsy-hermes-firewall.service. It adds ONE table of its own (inet botsy_hermes) and touches no
# other rule, so Lightsail's own firewall and any ufw rules stay as they are.
#
# For processes of the hermes user only:
#   - loopback (systemd-resolved's DNS stub at 127.0.0.53, Hermes's own webhook route) is allowed,
#     except NEW connections to the Hermes dashboard (127.0.0.1:9119): its page carries a session
#     token, and a scheduled job's URL monitor (cron/monitor.py, no address check) could fetch it.
#     Your SSH tunnel still reaches it (sshd is not the hermes user);
#   - HTTPS (TCP 443) to Anthropic's published API ranges is allowed
#     (160.79.104.0/23 and 2607:6bc0::/48, https://platform.claude.com/docs/en/api/ip-addresses,
#     read 2026-10-21: "These addresses will not change without notice");
#   - HTTPS to the addresses botsy-hermes-resolve found for Discord's hosts (discord.com,
#     gateway.discord.gg, cdn.discordapp.com, media.discordapp.net) and api.anthropic.com in the last
#     hour is allowed. Discord publishes no fixed ranges, so these are looked up every 10 minutes;
#   - everything else is refused at once (logged at most 6 times a minute as "botsy-hermes-blocked").
# One rule for the botsy user too: no NEW connection to the Hermes dashboard (127.0.0.1:9119).
#   The botsy user handles downloaded files and must never reach the dashboard's session token or
#   Hermes's own admin pages (config, cron, skills, the Chat terminal). The admin's sshd tunnel and
#   root stay allowed. Otherwise every other user on the server, Botsy included, is not affected.
# Check what is loaded:   sudo nft list table inet botsy_hermes

table inet botsy_hermes
delete table inet botsy_hermes

table inet botsy_hermes {
	set anthropic_v4 {
		type ipv4_addr
		flags interval
		elements = { 160.79.104.0/23 }
	}
	set anthropic_v6 {
		type ipv6_addr
		flags interval
		elements = { 2607:6bc0::/48 }
	}
	set allow_v4 {
		type ipv4_addr
		flags timeout
		timeout 1h
	}
	set allow_v6 {
		type ipv6_addr
		flags timeout
		timeout 1h
	}

	chain output {
		type filter hook output priority filter; policy accept;
		meta skuid "botsy" oifname "lo" tcp dport 9119 ct state new counter reject with tcp reset
		meta skuid != "hermes" accept
		ct state established,related accept
		oifname "lo" tcp dport 9119 counter reject with tcp reset
		oifname "lo" accept
		tcp dport 443 ip daddr @anthropic_v4 accept
		tcp dport 443 ip6 daddr @anthropic_v6 accept
		tcp dport 443 ip daddr @allow_v4 accept
		tcp dport 443 ip6 daddr @allow_v6 accept
		limit rate 6/minute burst 10 packets log prefix "botsy-hermes-blocked " level info
		counter reject with icmpx type admin-prohibited
	}
}
