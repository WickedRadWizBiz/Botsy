#!/usr/sbin/nft -f
# Optional egress limit for the hermes user (install_hermes.sh --firewall; docs/OVERSEER.md
# "Lock-down", layer 2). Installed as /usr/local/lib/botsy-hermes/nftables-hermes.conf and loaded
# by botsy-hermes-firewall.service. It adds ONE table of its own (inet botsy_hermes) and touches no
# other rule, so Lightsail's own firewall and any ufw rules stay as they are.
#
# For processes of the hermes user only:
#   - loopback (systemd-resolved's DNS stub at 127.0.0.53, later Hermes's own webhook route) is allowed;
#   - HTTPS (TCP 443) to Anthropic's published API ranges is allowed
#     (160.79.104.0/23 and 2607:6bc0::/48, https://platform.claude.com/docs/en/api/ip-addresses,
#     read 2026-10-21: "These addresses will not change without notice");
#   - HTTPS to the addresses botsy-hermes-resolve found for Discord's hosts (discord.com,
#     gateway.discord.gg, cdn.discordapp.com, media.discordapp.net) and api.anthropic.com in the last
#     hour is allowed. Discord publishes no fixed ranges, so these are looked up every 10 minutes;
#   - everything else is refused at once (logged at most 6 times a minute as "botsy-hermes-blocked").
# Every other user on the server, Botsy included, is not affected.
# Check what is loaded:   sudo nft list table inet botsy_hermes

table inet botsy_hermes
delete table inet botsy_hermes

table inet botsy_hermes {
	set anthropic_v4 {
		type ipv4_addr
		flags interval
		elements = { 160.79.104.0/23 }
	}
	set anthropic_v6 {
		type ipv6_addr
		flags interval
		elements = { 2607:6bc0::/48 }
	}
	set allow_v4 {
		type ipv4_addr
		flags timeout
		timeout 1h
	}
	set allow_v6 {
		type ipv6_addr
		flags timeout
		timeout 1h
	}

	chain output {
		type filter hook output priority filter; policy accept;
		meta skuid != "hermes" accept
		oifname "lo" accept
		ct state established,related accept
		tcp dport 443 ip daddr @anthropic_v4 accept
		tcp dport 443 ip6 daddr @anthropic_v6 accept
		tcp dport 443 ip daddr @allow_v4 accept
		tcp dport 443 ip6 daddr @allow_v6 accept
		limit rate 6/minute burst 10 packets log prefix "botsy-hermes-blocked " level info
		counter reject with icmpx type admin-prohibited
	}
}
